services:
  netbpf-exporter:
    image: ghcr.io/ybbapp/netbpf-exporter:latest
    container_name: netbpf-exporter
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      NF_LISTEN_ADDRESS: "${NF_LISTEN_ADDRESS:-:9101}"
      # Explicit allowlist. Do not remove this in Docker environments.
      NF_INTERFACES: "${NF_INTERFACES:-eth0}"
      NF_TOP_N_PEERS: "${NF_TOP_N_PEERS:-10}"
      NF_PEER_IDLE_TTL: "${NF_PEER_IDLE_TTL:-15m}"
      NF_MIN_PEER_BANDWIDTH: "${NF_MIN_PEER_BANDWIDTH:-10kb}"
